name: SDD Hogwarts Memory Castle

concurrency:
  group: sdd-hogwarts-memory-castle
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/hogwarts-memory-castle

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/evaluation-castle.spec.ts
