name: One-shot redeploy geometria-rpg

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redeploy-geometria-rpg.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 2; }
          echo "Cloudflare API token is configured."

      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: a972ce5c5f3963b70d5120e4323342bd84730006

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:cloudflare
